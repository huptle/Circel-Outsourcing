name: Deploy to Development Environment

on:
  push:
    branches:
      - dev
  workflow_dispatch:

jobs:
  deploy-dev:
    name: Deploy to Dev
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js (Optional Build Check)
        uses: actions/setup-node@v4
        with:
          node-version: 20
        continue-on-error: true

      - name: Build if package.json has build script
        run: |
          if [ -f package.json ]; then
            npm install || true
            npm run build --if-present || true
          fi
          # If dist/index.html was generated by build, sync to index.html
          if [ -f dist/index.html ]; then
            echo "Using newly built dist/index.html"
            cp dist/index.html index.html
          fi
        continue-on-error: true

      - name: Ensure target directory exists on server
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER || 'root' }}
          password: ${{ secrets.SERVER_PASSWORD }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: ${{ secrets.SERVER_PORT || 22 }}
          script: |
            mkdir -p /opt/erpnext-demo/hr-desk-dev

      - name: Upload Dev Files via SCP
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER || 'root' }}
          password: ${{ secrets.SERVER_PASSWORD }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: ${{ secrets.SERVER_PORT || 22 }}
          source: "index.html"
          target: "/opt/erpnext-demo/hr-desk-dev/"
          strip_components: 0

      - name: Update Container & Verify Dev Deployment
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER || 'root' }}
          password: ${{ secrets.SERVER_PASSWORD }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: ${{ secrets.SERVER_PORT || 22 }}
          script: |
            echo "==> Configuring Dev Assets..."
            chmod 644 /opt/erpnext-demo/hr-desk-dev/index.html
            
            # Synchronize to running frontend container assets
            docker exec erpnext-demo-frontend-1 mkdir -p /home/frappe/frappe-bench/assets/hr-desk-dev
            docker cp /opt/erpnext-demo/hr-desk-dev/index.html erpnext-demo-frontend-1:/home/frappe/frappe-bench/assets/hr-desk-dev/index.html
            
            echo "========================================================"
            echo " Dev Environment Deployed Successfully!"
            echo " Dev Preview URL: http://${{ secrets.SERVER_HOST }}:8090/assets/hr-desk-dev/index.html"
            echo "========================================================"
