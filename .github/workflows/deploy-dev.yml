name: Deploy to Development Environment

on:
  push:
    branches:
      - dev
  workflow_dispatch:

jobs:
  deploy-dev:
    name: Deploy to Dev
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Deploy to Dev Server via SSH
        env:
          RAW_HOST: ${{ secrets.SERVER_HOST }}
          RAW_USER: ${{ secrets.SERVER_USER }}
          SSH_KEY: ${{ secrets.SERVER_SSH_KEY }}
          SSH_PASS: ${{ secrets.SERVER_PASSWORD }}
        run: |
          # Sanitize host and user (strip any accidental trailing newlines/spaces)
          HOST=$(echo "$RAW_HOST" | tr -d '[:space:]')
          USER=$(echo "$RAW_USER" | tr -d '[:space:]')
          if [ -z "$USER" ]; then USER="root"; fi
          if [ -z "$HOST" ]; then HOST="187.127.133.225"; fi

          echo "Deploying to target host: $HOST as user: $USER"

          mkdir -p ~/.ssh
          chmod 700 ~/.ssh

          # Set up authentication (prefer SSH key, fallback to password)
          if [ -n "$SSH_KEY" ]; then
            echo "==> Configuring SSH key authentication..."
            printf "%s\n" "$SSH_KEY" | tr -d '\r' > ~/.ssh/deploy_key
            chmod 600 ~/.ssh/deploy_key
            SSH_OPTS="-i ~/.ssh/deploy_key -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -o LogLevel=ERROR -p 22"
            SSH_CMD="ssh $SSH_OPTS $USER@$HOST"
            SCP_CMD="scp -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -o LogLevel=ERROR -P 22"
          elif [ -n "$SSH_PASS" ]; then
            echo "==> Configuring password authentication..."
            sudo apt-get update -qq && sudo apt-get install -y -qq sshpass
            SSH_CMD="sshpass -p $SSH_PASS ssh -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -o LogLevel=ERROR -p 22 $USER@$HOST"
            SCP_CMD="sshpass -p $SSH_PASS scp -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -o LogLevel=ERROR -P 22"
          else
            echo "ERROR: Neither SERVER_SSH_KEY nor SERVER_PASSWORD is provided in GitHub Secrets!"
            exit 1
          fi

          # FIX-0: dev is served by Frappe at /hr-desk-dev (login required), like production.
          # It uses the same hr-desk.html and hr_desk.py as production, under a -dev name.
          echo "==> 1. Uploading hr-desk.html and hr_desk.py to the dev page..."
          $SSH_CMD "mkdir -p /opt/erpnext-demo/deploy_staging_dev"
          $SCP_CMD hr-desk.html hr_desk.py "$USER@$HOST:/opt/erpnext-demo/deploy_staging_dev/"

          echo "==> 2. Applying dev release and clearing cache..."
          $SSH_CMD "
            cp /opt/erpnext-demo/deploy_staging_dev/hr-desk.html /opt/erpnext-demo/apps/hrms/hrms/www/hr-desk-dev.html
            # FIX-7b: Python page code is only re-read when the backend restarts, so restart it when hr_desk.py changed
            PY_CHANGED=0
            cmp -s /opt/erpnext-demo/deploy_staging_dev/hr_desk.py /opt/erpnext-demo/apps/hrms/hrms/www/hr_desk_dev.py || PY_CHANGED=1
            cp /opt/erpnext-demo/deploy_staging_dev/hr_desk.py /opt/erpnext-demo/apps/hrms/hrms/www/hr_desk_dev.py
            chmod 644 /opt/erpnext-demo/apps/hrms/hrms/www/hr-desk-dev.html /opt/erpnext-demo/apps/hrms/hrms/www/hr_desk_dev.py
            docker exec erpnext-demo-frontend-1 rm -rf /home/frappe/frappe-bench/assets/hr-desk-dev || true
            docker exec erpnext-demo-backend-1 bench --site frontend clear-cache
            docker exec erpnext-demo-backend-1 bench --site frontend clear-website-cache
            if [ \"\$PY_CHANGED\" = 1 ]; then echo 'hr_desk.py changed: restarting backend (about 20 seconds)'; docker restart erpnext-demo-backend-1; fi
          "

          echo "=========================================================="
          echo " Dev Environment Deployed Successfully!"
          echo " Dev URL (login required): http://$HOST:8090/hr-desk-dev"
          echo "=========================================================="
