name: Deploy to Production Environment

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy-production:
    name: Deploy to Production
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js (Optional Build Check)
        uses: actions/setup-node@v4
        with:
          node-version: 20
        continue-on-error: true

      - name: Build if package.json has build script
        run: |
          if [ -f package.json ]; then
            npm install || true
            npm run build --if-present || true
          fi
          # If dist/index.html was generated by build, sync to index.html and hr-desk.html
          if [ -f dist/index.html ]; then
            echo "Using newly built dist/index.html"
            cp dist/index.html index.html
          fi
          # Ensure hr-desk.html is kept in sync with index.html
          if [ -f index.html ] && [ ! -f hr-desk.html ]; then
            cp index.html hr-desk.html
          fi
        continue-on-error: true

      - name: Ensure target staging directory exists on server
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER || 'root' }}
          password: ${{ secrets.SERVER_PASSWORD }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: ${{ secrets.SERVER_PORT || 22 }}
          script: |
            mkdir -p /opt/erpnext-demo/deploy_staging /opt/erpnext-demo/apps/hrms/hrms/www /opt/erpnext-demo/hr-desk

      - name: Upload Production Files to Server Staging
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER || 'root' }}
          password: ${{ secrets.SERVER_PASSWORD }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: ${{ secrets.SERVER_PORT || 22 }}
          source: "index.html,hr-desk.html,hr_desk.py"
          target: "/opt/erpnext-demo/deploy_staging/"
          strip_components: 0

      - name: Atomic Deploy & Clear Cache
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER || 'root' }}
          password: ${{ secrets.SERVER_PASSWORD }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: ${{ secrets.SERVER_PORT || 22 }}
          script: |
            echo "==> Applying Production Release..."
            cd /opt/erpnext-demo/deploy_staging
            
            # Copy hr-desk.html or index.html to Frappe www folder
            if [ -f hr-desk.html ]; then
              cp hr-desk.html /opt/erpnext-demo/apps/hrms/hrms/www/hr-desk.html
            elif [ -f index.html ]; then
              cp index.html /opt/erpnext-demo/apps/hrms/hrms/www/hr-desk.html
            fi
            
            # Copy index.html to fallback static directory
            if [ -f index.html ]; then
              cp index.html /opt/erpnext-demo/hr-desk/index.html
            fi
            
            # Copy Python context controller if updated
            if [ -f hr_desk.py ]; then
              cp hr_desk.py /opt/erpnext-demo/apps/hrms/hrms/www/hr_desk.py
            fi
            
            # Set permissions
            chmod 644 /opt/erpnext-demo/apps/hrms/hrms/www/hr-desk.html 2>/dev/null || true
            chmod 644 /opt/erpnext-demo/apps/hrms/hrms/www/hr_desk.py 2>/dev/null || true
            chmod 644 /opt/erpnext-demo/hr-desk/index.html 2>/dev/null || true
            
            echo "==> Clearing Frappe Bench Cache..."
            docker exec erpnext-demo-backend-1 bench --site frontend clear-cache || true
            
            echo "==> Reloading Nginx..."
            docker exec erpnext-demo-frontend-1 nginx -s reload || true
            
            echo "========================================================"
            echo " Production Deployment Succeeded!"
            echo " Live Production URL: http://${{ secrets.SERVER_HOST }}:8090/hr-desk"
            echo "========================================================"
