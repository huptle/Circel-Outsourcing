name: Deploy to Production Environment

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy-production:
    name: Deploy to Production
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js (Optional Build Check)
        uses: actions/setup-node@v4
        with:
          node-version: 20
        continue-on-error: true

      - name: Build if package.json has build script
        run: |
          if [ -f package.json ]; then
            npm install || true
            npm run build --if-present || true
          fi
          # If dist/index.html was generated by build, sync to index.html and hr-desk.html
          if [ -f dist/index.html ]; then
            echo "Using newly built dist/index.html"
            cp dist/index.html index.html
          fi
          # Ensure hr-desk.html is kept in sync with index.html
          if [ -f index.html ] && [ ! -f hr-desk.html ]; then
            cp index.html hr-desk.html
          fi
        continue-on-error: true

      - name: Deploy to Production Server via SSH
        env:
          RAW_HOST: ${{ secrets.SERVER_HOST }}
          RAW_USER: ${{ secrets.SERVER_USER }}
          SSH_KEY: ${{ secrets.SERVER_SSH_KEY }}
          SSH_PASS: ${{ secrets.SERVER_PASSWORD }}
        run: |
          # Sanitize host and user (strip any accidental trailing newlines/spaces)
          HOST=$(echo "$RAW_HOST" | tr -d '[:space:]')
          USER=$(echo "$RAW_USER" | tr -d '[:space:]')
          if [ -z "$USER" ]; then USER="root"; fi
          if [ -z "$HOST" ]; then HOST="187.127.133.225"; fi

          echo "Deploying to target host: $HOST as user: $USER"

          mkdir -p ~/.ssh
          chmod 700 ~/.ssh

          # Set up authentication (prefer SSH key, fallback to password)
          if [ -n "$SSH_KEY" ]; then
            echo "==> Configuring SSH key authentication..."
            printf "%s\n" "$SSH_KEY" | tr -d '\r' > ~/.ssh/deploy_key
            chmod 600 ~/.ssh/deploy_key
            SSH_OPTS="-i ~/.ssh/deploy_key -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -o LogLevel=ERROR -p 22"
            SSH_CMD="ssh $SSH_OPTS $USER@$HOST"
            SCP_CMD="scp -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -o LogLevel=ERROR -P 22"
          elif [ -n "$SSH_PASS" ]; then
            echo "==> Configuring password authentication..."
            sudo apt-get update -qq && sudo apt-get install -y -qq sshpass
            SSH_CMD="sshpass -p $SSH_PASS ssh -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -o LogLevel=ERROR -p 22 $USER@$HOST"
            SCP_CMD="sshpass -p $SSH_PASS scp -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -o LogLevel=ERROR -P 22"
          else
            echo "ERROR: Neither SERVER_SSH_KEY nor SERVER_PASSWORD is provided in GitHub Secrets!"
            exit 1
          fi

          echo "==> 1. Ensuring target staging directories exist on server..."
          $SSH_CMD "mkdir -p /opt/erpnext-demo/deploy_staging /opt/erpnext-demo/apps/hrms/hrms/www /opt/erpnext-demo/hr-desk"

          echo "==> 2. Uploading production files to staging..."
          $SCP_CMD index.html hr-desk.html hr_desk.py "$USER@$HOST:/opt/erpnext-demo/deploy_staging/"

          echo "==> 3. Applying release and clearing cache..."
          $SSH_CMD "
            cp /opt/erpnext-demo/deploy_staging/hr-desk.html /opt/erpnext-demo/apps/hrms/hrms/www/hr-desk.html
            cp /opt/erpnext-demo/deploy_staging/index.html /opt/erpnext-demo/hr-desk/index.html
            if [ -f /opt/erpnext-demo/deploy_staging/hr_desk.py ]; then
              cp /opt/erpnext-demo/deploy_staging/hr_desk.py /opt/erpnext-demo/apps/hrms/hrms/www/hr_desk.py
            fi
            chmod 644 /opt/erpnext-demo/apps/hrms/hrms/www/hr-desk.html 2>/dev/null || true
            chmod 644 /opt/erpnext-demo/apps/hrms/hrms/www/hr_desk.py 2>/dev/null || true
            chmod 644 /opt/erpnext-demo/hr-desk/index.html 2>/dev/null || true
            docker exec erpnext-demo-backend-1 bench --site frontend clear-cache || true
            docker exec erpnext-demo-frontend-1 nginx -s reload || true
          "

          echo "=========================================================="
          echo " Production Deployment Succeeded!"
          echo " Live Production URL: http://$HOST:8090/hr-desk"
          echo "=========================================================="
